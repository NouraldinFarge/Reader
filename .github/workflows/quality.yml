name: Quality gates

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-quality:
    name: Web, parser, persistence, and accessibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting, lint, facts, links, and vendored files
        run: |
          pnpm format:check
          pnpm lint
          pnpm verify:facts
          pnpm verify:links
          pnpm verify:vendor
          pnpm verify:private-data

      - name: Run unit and coverage gates
        run: |
          pnpm test:unit
          pnpm test:coverage

      - name: Install the pinned Chromium runtime
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser, persistence, privacy, and accessibility scenarios
        run: pnpm test:e2e

      - name: Scan JavaScript dependencies
        run: |
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level high

      - name: Generate SPDX SBOM
        run: pnpm generate:sbom

      - name: Preserve bounded verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-web-verification
          path: |
            test-results/browser-report.json
            test-results/coverage/coverage-summary.json
            sbom/*.spdx.json
          if-no-files-found: warn
          retention-days: 7

  windows-shell:
    name: Rust shell and unsigned NSIS candidate
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, verified 2026-08-17
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy,rustfmt

      - name: Install cargo-audit
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the Windows dependency graph and Rust code
        run: |
          pnpm verify:windows-dependencies
          pnpm scan:cargo
          pnpm test:rust

      - name: Build an unsigned NSIS verification candidate
        run: pnpm build:windows:release

      - name: Preserve the unsigned CI candidate briefly
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reader-unsigned-nsis-verification-only
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 3
