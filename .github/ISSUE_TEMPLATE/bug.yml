name: Bug report
description: Report a reproducible Reader problem without sharing private reading data.
title: '[Bug]: '
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Reader. Do not attach copyrighted publications, protected audio, activation data, account information, private notes, exported library JSON, or signing material. Use a synthetic file if the problem requires an attachment.
  - type: input
    id: version
    attributes:
      label: Reader version
      placeholder: 0.1.0-alpha.4
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Related format
      options:
        - Not file-specific
        - EPUB
        - PDF
        - TXT / Markdown / HTML
        - Unprotected audio
        - Protected AAX metadata only
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Describe actions and visible results. Replace titles, filenames, quotes, and paths with neutral placeholders.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, WebView2 version if known, display scaling, and whether Reader was installed or run locally.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed copyrighted content, protected-media details, private notes, account data, activation data, personal paths, and credentials.
          required: true
