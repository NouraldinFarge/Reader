<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reader social preview source</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #101612;
        color: #f7f2e7;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        position: relative;
        display: grid;
        grid-template-columns: 46% 54%;
        background:
          radial-gradient(circle at 18% 12%, rgb(104 181 143 / 18%), transparent 36%),
          radial-gradient(circle at 82% 95%, rgb(192 157 103 / 16%), transparent 35%), #111813;
      }

      body::before {
        position: absolute;
        inset: 0;
        border: 1px solid rgb(255 255 255 / 10%);
        content: '';
        pointer-events: none;
      }

      .copy {
        z-index: 2;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 7.5% 5% 7.5% 7%;
      }

      .brand {
        display: flex;
        gap: 18px;
        align-items: center;
        margin-bottom: 34px;
      }

      .mark {
        display: grid;
        width: 58px;
        height: 58px;
        place-items: center;
        border-radius: 15px;
        background: #8fd3b1;
        box-shadow: 0 18px 46px rgb(71 148 110 / 24%);
        color: #133627;
        font-family: Georgia, serif;
        font-size: 38px;
        font-weight: 800;
      }

      .status {
        color: #9cdbbc;
        font-size: 15px;
        font-weight: 800;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      h1 {
        max-width: 620px;
        margin: 0;
        font-family: Georgia, 'Times New Roman', serif;
        font-size: clamp(54px, 5.6vw, 84px);
        line-height: 0.98;
        letter-spacing: -0.04em;
      }

      h1 span {
        display: block;
        margin-top: 13px;
        color: #afd7c3;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 0.39em;
        font-weight: 650;
        letter-spacing: -0.025em;
      }

      .summary {
        max-width: 560px;
        margin: 30px 0 32px;
        color: #d1d4cd;
        font-size: clamp(18px, 1.65vw, 25px);
        line-height: 1.45;
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        padding: 10px 14px;
        border: 1px solid rgb(175 215 195 / 22%);
        border-radius: 999px;
        background: rgb(255 255 255 / 4%);
        color: #dce9e1;
        font-size: 14px;
        font-weight: 700;
      }

      .visual {
        position: relative;
        display: flex;
        align-items: center;
        padding: 6.5% 0 6.5% 2%;
      }

      .window {
        position: relative;
        width: 112%;
        height: 80%;
        overflow: hidden;
        border: 1px solid rgb(255 255 255 / 16%);
        border-radius: 24px 0 0 24px;
        background: #151a16;
        box-shadow: 0 35px 90px rgb(0 0 0 / 45%);
      }

      .window::before {
        position: absolute;
        z-index: 2;
        top: 0;
        right: 0;
        left: 0;
        height: 35px;
        background: linear-gradient(180deg, rgb(255 255 255 / 8%), transparent);
        content: '';
      }

      .window img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 10% 20%;
      }

      .play {
        position: absolute;
        z-index: 3;
        top: 50%;
        left: 50%;
        display: none;
        width: 92px;
        height: 92px;
        transform: translate(-50%, -50%);
        place-items: center;
        border: 2px solid rgb(255 255 255 / 52%);
        border-radius: 50%;
        background: rgb(16 24 19 / 78%);
        box-shadow: 0 18px 50px rgb(0 0 0 / 45%);
        backdrop-filter: blur(12px);
      }

      .play::after {
        width: 0;
        height: 0;
        margin-left: 8px;
        border-top: 16px solid transparent;
        border-bottom: 16px solid transparent;
        border-left: 24px solid #b6e5cd;
        content: '';
      }

      .demo-label {
        display: none;
      }

      body.demo .play {
        display: grid;
      }

      body.demo .demo-label {
        display: inline;
      }

      body.demo .standard-label {
        display: none;
      }

      @media (max-width: 1220px) {
        body {
          grid-template-columns: 49% 51%;
        }

        .copy {
          padding-left: 6%;
        }

        .summary {
          margin-block: 24px;
        }
      }
    </style>
  </head>
  <body>
    <section class="copy" aria-label="Reader summary">
      <div class="brand">
        <div class="mark" aria-hidden="true">R</div>
        <div class="status">
          <span class="standard-label">Public-source alpha · 0.1.0-alpha.4</span
          ><span class="demo-label">75-second product tour</span>
        </div>
      </div>
      <h1>Reader <span>a local-first reading library</span></h1>
      <p class="summary">
        Bounded publication imports, offline progress and annotations, and a least-privilege Windows shell.
      </p>
      <div class="chips" aria-label="Verified technology">
        <span class="chip">EPUB · PDF · TEXT · AUDIO</span>
        <span class="chip">JavaScript · IndexedDB</span>
        <span class="chip">Rust · Tauri</span>
      </div>
    </section>
    <section class="visual" aria-label="Actual Reader application capture">
      <div class="window">
        <img
          src="../screenshots/library-overview.jpg"
          alt="Reader library overview with three original synthetic titles"
        />
        <div class="play" aria-hidden="true"></div>
      </div>
    </section>
    <script>
      if (new URLSearchParams(location.search).get('mode') === 'demo') document.body.classList.add('demo');
    </script>
  </body>
</html>
